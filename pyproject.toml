[project]
name = "speciessearchtool"
version = "1.0.0"
description = ""
authors = [
    {name = "Jean Carlos",email = "jeancc.costa@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)"
]

[tool.poetry]
packages = [{include = "speciessearchtool", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-httpx (>=0.36.2,<0.37.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "nbformat (>=5.10.4,<6.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)"
]
